name: Docker build
run-name: Build Docker image for ${{ github.ref_name }}

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            devopseasylearning/s13-training-camps
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show published image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### Published Docker image\n\n'
            while IFS= read -r tag; do
              [ -z "$tag" ] || printf -- '- `%s`\n' "$tag"
            done <<< "$IMAGE_TAGS"
            printf '\n**Digest:** `%s`\n\n' "$IMAGE_DIGEST"
            printf 'Pull with:\n\n```bash\n'
            printf 'docker pull %s\n' "${IMAGE_TAGS%%$'\n'*}"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Published Docker image:\n%s\nDigest: %s\n' "$IMAGE_TAGS" "$IMAGE_DIGEST"
